name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # BL77: the same tests on Windows and macOS (CPU runners, no GPU). `auto` + `fast` stays on CPU; this checks
  # that the package installs and the tests pass there. npm does not download CUDA on these systems.
  test-os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # Windows checks files out with CRLF by default; several tests read repo files and expect LF (as on Linux and in git).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # K1: the published package works once installed (only `files` + `dependencies`, no repo).
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No GPU on the runner: skip onnxruntime-node's CUDA download (one less network dependency, K2).
      PUSHUP_SMOKE_NPM_ARGS: --onnxruntime-node-install-cuda=skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/pack-smoke.sh
